---
openapi: "3.0.1"
info:
  title: "${Environment}-orchestration-oidc-api"
paths:
  /ipv-callback:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IpvCallbackFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /sis-callback:
    Fn::If:
      - SisEnabled
      - get:
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SISCallbackFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /trustmark:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TrustmarkFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /doc-app-callback:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DocAppCallbackFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /.well-known/storage-token-jwk.json:
    Fn::If:
      - IsNotDevEnvironment
      - get:
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${StorageTokenJwkFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /userinfo:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserInfoFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /token:
    post:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${TokenFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /.well-known/openid-configuration:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${OpenIdConfigurationFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /logout:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LogoutFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /.well-known/jwks.json:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${JwksFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /.well-known/ipv-jwks.json:
    Fn::If:
      - IsNotDevEnvironment
      - get:
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${IpvJwksFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /.well-known/sis-jwks.json:
    Fn::If:
      - IsNotDevEnvironment
      - get:
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SISJwksFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /authorize:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorisationFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /orchestration-redirect:
    get:
      x-amazon-apigateway-integration:
        uri:
          Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthenticationCallbackFunction.Arn}:latest/invocations"
        httpMethod: "POST"
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "aws_proxy"
  /.well-known/auth-jwks.json:
    Fn::If:
      - IsNotDevEnvironment
      - get:
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthJwksFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /connect/register:
    Fn::If:
      - IsNotProduction
      - post:
          security:
            - api_key: []
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ClientRegistrationFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /connect/register/{clientId}:
    Fn::If:
      - IsNotProduction
      - put:
          parameters:
            - name: "clientId"
              in: "path"
              required: true
              schema:
                type: "string"
          security:
            - api_key: []
          x-amazon-apigateway-integration:
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateClientConfigFunction.Arn}:latest/invocations"
            httpMethod: "POST"
            requestParameters:
              integration.request.path.clientId: "method.request.path.clientId"
            passthroughBehavior: "when_no_match"
            timeoutInMillis: 29000
            type: "aws_proxy"
      - ${AWS::NoValue}
  /robots.txt:
    get:
      responses:
        "200":
          description: "200 response"
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/Empty"
      x-amazon-apigateway-integration:
        responses:
          default:
            statusCode: "200"
            responseTemplates:
              text/plain: "User-agent: *\nDisallow: /\n"
        requestTemplates:
          application/json: '{"statusCode":200}'
        passthroughBehavior: "when_no_match"
        timeoutInMillis: 29000
        type: "mock"
  /.well-known/{key+}:
    Fn::If:
      - IsDev
      - get:
          parameters:
            - name: key
              in: path
              required: true
              schema:
                type: string
          responses:
            "200":
              description: Asset
              headers:
                Content-Type:
                  schema:
                    type: string
                Content-Length:
                  schema:
                    type: string
            "403":
              description: Not found
              headers:
                Content-Type:
                  schema:
                    type: string
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
          x-amazon-apigateway-integration:
            type: aws
            httpMethod: GET
            credentials:
              Fn::GetAtt: [WellKnownJwksBucketAccessApiRole, Arn]
            uri:
              Fn::Sub: "arn:aws:apigateway:${AWS::Region}:s3:path/${WellKnownJwksBucket}/.well-known/{key}"
            passthroughBehavior: when_no_match
            requestParameters:
              integration.request.path.key: "method.request.path.key"
            responses:
              default:
                statusCode: "200"
                responseParameters:
                  method.response.header.Content-Type: "integration.response.header.Content-Type"
                  method.response.header.Content-Length: "integration.response.header.Content-Length"
              "403|404":
                statusCode: "403"
                responseParameters:
                  method.response.header.Content-Type: "'application/json'"
                responseTemplates:
                  application/json: '{"message":"Missing Authentication Token"}'
      - ${AWS::NoValue}

components:
  schemas:
    Empty:
      title: "Empty Schema"
      type: "object"
  securitySchemes:
    api_key:
      type: "apiKey"
      name: "x-api-key"
      in: "header"
